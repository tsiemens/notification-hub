[project]
name = "notification-hub"
version = "0.1.0"
description = "A single-user notification and approval hub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46,<47",
    "flask>=3.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_hub"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
