[project]
name = "notification-hub"
version = "0.1.0"
description = "A single-user notification and approval hub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46,<47",
    "flask>=3.1,<4",
]

[project.scripts]
nh-server = "notification_hub.server.runner:main"
nh-notifier = "notification_hub.notifier.cli:main"
nh-client-cli = "notification_hub.debug_cli.cli:main"
nh-client = "notification_hub.gui.launcher:main"
nh-desktop-installer = "notification_hub.gui.desktop_integration:main"

[project.optional-dependencies]
gui = [
    "pywebview[gtk]>=5,<7; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "/src/notification_hub/gui/web/**",
    "/src/notification_hub/gui/resources/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notification_hub"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/notification_hub",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
